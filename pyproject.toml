[project]
name = "veex"
version = "0.1.0"
description = "A goated CLI"
readme = "README.md"
authors = [
    { name = "vxstudio", email = "...@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.0.0",
    "pyfiglet>=1.0.4",
    "python-dotenv>=1.2.4",
    "rich>=15.0.0",
]

[project.scripts]
veex = "veex.__main__:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
